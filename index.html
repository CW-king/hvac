<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>공조냉동 문제은행</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f9; --card:#ffffff; --ink:#0f1c24; --muted:#5b6b76; --line:#e1e8ed;
  --brand:#1d4ed8; --brand-soft:#e6edfd; --ok:#15803d; --ok-soft:#dcfce7;
  --no:#b91c1c; --no-soft:#fee2e2; --fix:#9a3412; --fix-soft:#ffedd5;
  --shadow:0 1px 2px rgba(15,28,36,.06),0 4px 14px rgba(15,28,36,.06); --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1218;--card:#141d25;--ink:#ecf3f7;--muted:#91a3ae;--line:#24313b;
        --brand:#93b4fd;--brand-soft:#141d33;--ok:#4ade80;--ok-soft:#0f2818;
        --no:#fca5a5;--no-soft:#3a1414;--fix:#fdba74;--fix-soft:#341c0c;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.65;word-break:keep-all;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 48px}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:760px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:8px;min-height:54px}
.hd h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.iconbtn{background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:700;line-height:1;text-decoration:none}
.iconbtn.back{font-size:22px;padding:6px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:15px 16px}
.sec-t{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:24px 4px 8px}
.muted{color:var(--muted)}.small{font-size:13px}.hide{display:none!important}
.hero{padding:26px 4px 6px}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.hero p{margin:0;color:var(--muted);font-size:14.5px}
.stat{display:flex;gap:10px;margin-top:14px}
.stat .card{flex:1;padding:12px 14px}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.bar{display:block;height:5px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.ulist{border-radius:var(--r);box-shadow:var(--shadow)}
.unit{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-bottom:0}
.ulist .unit:first-child{border-radius:var(--r) var(--r) 0 0}
.ulist .unit:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:1px solid var(--line)}
.ulist .unit:only-child{border-radius:var(--r)}
.unum{flex:0 0 46px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:800;font-size:12.5px}
.unit.done .unum{background:var(--ok-soft);color:var(--ok)}
.unit.off{opacity:.5}
.unit.off .unum{background:var(--line);color:var(--muted)}
.ubody{flex:1;min-width:0}
.utitle{display:block;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.umeta{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.ar{color:var(--muted);font-size:18px}
.tabs{display:flex;gap:5px;margin-top:14px;background:var(--card);padding:5px;border-radius:13px;border:1px solid var(--line);
  position:sticky;top:62px;z-index:20}
.tabs button{flex:1;padding:9px 4px;border:0;background:none;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.tabs button.on{color:#0b1218}}
.summary{margin-top:14px;font-size:14.6px;line-height:1.75}
.yt{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700;text-decoration:none;
  padding:7px 12px;border-radius:99px;background:var(--brand-soft)}
.theory h3{font-size:15px;font-weight:800;margin:26px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--brand);color:var(--brand);
  display:flex;align-items:baseline;gap:8px}
.theory h3 a{margin-left:auto;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.theory p{margin:9px 0;font-size:14.8px;line-height:1.75}
.theory ul{margin:9px 0;padding-left:0;list-style:none}
.theory li{position:relative;padding:5px 0 5px 17px;font-size:14.6px;line-height:1.7}
.theory li::before{content:'';position:absolute;left:2px;top:14px;width:5px;height:5px;border-radius:1px;background:var(--brand)}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:11px 0;border:1px solid var(--line);border-radius:11px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.8px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:.03em;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--brand-soft);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;min-width:84px}
.fx{margin:11px 0;padding:12px 14px;border-radius:11px;background:var(--brand-soft)}
.fx .fn{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.03em}
.fx .ff{font-size:15px;font-weight:700;margin-top:3px;line-height:1.55;word-break:break-word}
.fx .fd{font-size:13px;color:var(--muted);margin-top:4px}
.nt{margin:12px 0;padding:12px 14px;border-radius:11px;background:var(--fix-soft);border-left:3px solid var(--fix);font-size:13.8px;line-height:1.7}
.nt b.nh{display:block;font-weight:800;color:var(--fix);font-size:12.5px;letter-spacing:.02em;margin-bottom:3px}
mark{background:var(--fix-soft);color:var(--fix);font-weight:700;padding:0 3px;border-radius:3px}
.tip{margin:18px 0 0;padding:12px 14px;border-radius:11px;background:var(--ok-soft);color:var(--ok);font-size:13.8px;font-weight:600}
.tip b{display:block;font-size:11.5px;letter-spacing:.05em;margin-bottom:2px;opacity:.85}
.q{margin-top:14px}
.qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.qno{font-weight:800;color:var(--brand);font-size:13px}
.qstem{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.65}
.ch{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-size:14.3px;cursor:pointer;line-height:1.5}
.ch .k{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--line);font-size:12px;font-weight:800;margin-right:8px;vertical-align:-4px}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}.ch.ok .k{background:var(--ok);color:#fff}
.ch.no{border-color:var(--no);background:var(--no-soft)}.ch.no .k{background:var(--no);color:#fff}
.ch:disabled{cursor:default}
.reveal{margin-top:10px;padding:12px 13px;border-radius:11px;font-size:14px}
.reveal.ok{background:var(--ok-soft)}.reveal.no{background:var(--no-soft)}
.reveal .lab{font-weight:800;font-size:12px;letter-spacing:.04em;display:block;margin-bottom:3px}
.reveal.ok .lab{color:var(--ok)}.reveal.no .lab{color:var(--no)}
.reveal .exp{font-size:13.6px;line-height:1.65}
.reveal a{font-size:12.5px;font-weight:700;text-decoration:none}
.btn{padding:11px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0b1218}}
.result{padding:22px 18px;text-align:center;margin-top:16px}
.result b{font-size:28px;font-weight:800;display:block}
.term{padding:12px 15px;border-bottom:1px solid var(--line)}
.term:last-child{border-bottom:0}
.term b{font-weight:800;font-size:15px}
.term .en{font-size:12px;color:var(--muted);margin-left:6px;font-weight:600}
.term .df{font-size:14px;margin-top:2px;line-height:1.6}
.term .from{font-size:11.5px;color:var(--muted);margin-top:3px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;margin-top:14px}
.tnote{padding:12px 15px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.7}
.tnote:last-child{border-bottom:0}
.tbadge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--fix-soft);color:var(--fix);margin-left:6px;vertical-align:2px}
.navrow{display:flex;gap:8px;margin-top:22px}
.navrow .btn{flex:1;text-align:center;text-decoration:none;color:inherit}
.ufig{margin:12px 0;padding:8px;background:#fff;border-radius:10px;text-align:center}.ufig img{display:block;max-width:100%;max-height:420px;height:auto;margin:0 auto}.ufig.multi{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}.ufig.multi img{max-width:46%;max-height:140px;margin:0}.ufig figcaption{flex-basis:100%;color:#333;font-size:.88em;margin-top:6px;line-height:1.5}.ufig .gsrc{display:block;color:#888;font-size:.85em}
.xfig{display:block;max-width:100%;height:auto;margin:10px 0;border-radius:8px;background:#fff}
.ch .xfig{display:inline-block;margin:4px 0 0;vertical-align:middle;max-height:84px;max-width:85%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chips a{padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700;text-decoration:none;color:inherit}
.chips a.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.chips a.on{color:#0b1218}}
.xq{margin-top:12px}
.xq .ans{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);font-size:13.8px;line-height:1.7}
.xq .ans b{color:var(--ok)}
.xq .rel{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;text-decoration:none}
.xopt .ok{color:var(--ok);font-weight:800}
.xsub{font-size:12px;color:var(--muted);font-weight:700}
.part{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.part summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.part summary::-webkit-details-marker{display:none}
.part summary b{font-size:16px;font-weight:800}
.part summary span{grid-column:1;font-size:12.5px;color:var(--muted)}
.part summary em{grid-row:1/3;grid-column:2;font-style:normal;font-size:12px;font-weight:800;color:var(--brand);background:var(--brand-soft);padding:4px 9px;border-radius:99px}
.part[open] summary{border-bottom:1px solid var(--line)}
.part .ulist{margin:0;padding:8px}
.vids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vids .yt{margin-top:0}
footer{margin-top:28px;padding:16px 6px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);line-height:1.7}
.hub{padding:30px 4px 18px}.hub h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}.hub p{margin:0;color:var(--muted);font-size:14.5px}
.grid{display:grid;gap:11px}
a.app{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 17px}
.ic{flex:0 0 52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--s);color:var(--c);font-weight:800;font-size:13px;letter-spacing:-.02em;line-height:1.25;text-align:center}
.tx{flex:1;min-width:0}.tt{display:block;font-weight:800;font-size:17px;letter-spacing:-.02em}.ds{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.n1{--c:#1d4ed8;--s:#e6edfd}.n2{--c:#0e7490;--s:#e0f2f4}.n3{--c:#b45309;--s:#fdf0dd}.n4{--c:#4338ca;--s:#eceafd}.n5{--c:#166534;--s:#dcfce7}.n6{--c:#0f766e;--s:#d7f0ec}
@media (prefers-color-scheme:dark){.n1{--c:#93b4fd;--s:#141d33}.n2{--c:#67e8f9;--s:#0d2429}.n3{--c:#fbbf24;--s:#2a2011}.n4{--c:#a5b4fc;--s:#1c1f3c}.n5{--c:#86efac;--s:#0f2418}.n6{--c:#5eead4;--s:#0d2b28}}
.ht{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:26px 4px 10px}
a.guide{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;background:var(--brand-soft);border:1px solid var(--brand);border-radius:16px;padding:15px 17px;margin-bottom:14px}
a.guide .gi{flex:0 0 40px;height:40px;border-radius:12px;background:var(--brand);color:var(--card);display:grid;place-items:center;font-size:19px}
a.guide .gx{flex:1;min-width:0}a.guide .gx b{display:block;font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--brand)}a.guide .gx span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.fnote{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 4px 6px}
.glist{display:grid;gap:10px;margin-top:14px}
.gcard{display:block;padding:15px 16px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.gcard .gt{display:block;font-weight:800;font-size:16px;letter-spacing:-.02em}.gcard .gm{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.steps{counter-reset:st;margin:8px 0 0;padding:0;list-style:none}.steps li{counter-increment:st;position:relative;padding:12px 14px 12px 52px;margin-top:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.65}
.steps li::before{content:counter(st);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center;font-size:13px}
.steps b{display:block;font-size:15px}
textarea.bk{width:100%;min-height:90px;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:12px ui-monospace,Menlo,monospace}
/*book*/
.serif,.cover h2,.hub h2,.theory h3,.xhead b{font-family:"Noto Serif KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",serif}
.cover{margin-top:14px;padding:22px 18px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--brand)}
.cv-part{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--brand)}
.cv-no{position:absolute;right:16px;top:12px;font-size:44px;font-weight:900;color:var(--brand-soft);line-height:1;font-family:"Noto Serif KR",serif}
.cover h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:6px 0 12px;line-height:1.35;padding-right:64px}
.cv-goal{padding:12px 14px;border-radius:12px;background:var(--brand-soft);font-size:14.3px;line-height:1.75}
.cv-goal b{display:block;font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.06em;margin-bottom:3px}
.cv-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cv-meta span{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.theory{counter-reset:sec fig tbl}
.theory h3{counter-increment:sec;font-size:17px;border-bottom:0;padding:0;margin:30px 0 10px;color:var(--ink);align-items:center}
.theory h3::before{content:counter(sec,decimal-leading-zero);flex:0 0 auto;font-size:13px;font-weight:900;color:#fff;background:var(--brand);border-radius:7px;padding:3px 7px;font-family:-apple-system,"Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){.theory h3::before{color:#0b1218}}
.theory h3 a{font-family:-apple-system,"Malgun Gothic",sans-serif;padding:3px 9px;border-radius:99px;background:var(--brand-soft)}
.theory .tblw{counter-increment:tbl;position:relative;margin-top:26px;overflow:visible}
.theory .tblw::before{content:'표 ' counter(tbl);position:absolute;top:-19px;left:2px;font-size:11.5px;font-weight:800;color:var(--muted)}
.theory .tblw table{border-radius:11px;overflow:hidden}
.theory .ufig{counter-increment:fig;border:1px solid var(--line)}
.theory .ufig figcaption::before{content:'그림 ' counter(fig) '  ';font-weight:800;color:#0f766e}
.fx{background:var(--card);border:1.5px solid var(--brand);border-left-width:6px}
.fx .fn::before{content:'공식 · '}
.nt b.nh::before{content:'⚠ '}
.tip{margin-top:28px;padding:16px;border-radius:14px;border:1.5px dashed var(--ok);background:var(--ok-soft)}
.tip b{font-size:13px}
.q .qhead .qno,.xq .qno{font-size:13px;font-weight:900;color:#fff;background:var(--brand);border-radius:7px;padding:2px 8px}
@media (prefers-color-scheme:dark){.q .qhead .qno,.xq .qno{color:#0b1218}}
.qstem{font-size:15.5px}
.ch .k{width:auto;height:auto;background:none!important;color:var(--brand);font-size:17px;margin-right:6px;vertical-align:-1px;border-radius:0}
.ch.ok .k{color:var(--ok)!important}.ch.no .k{color:var(--no)!important}
.xq .ans{background:var(--card);border:1.5px solid var(--ok);border-left-width:6px}
.reveal .lab{font-size:13px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 2px 0}.prog>i{display:block;height:100%;background:var(--brand)}
.xhead{margin-top:14px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.xhead b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.xhead span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
</style>
</head>

<script>
(function(){
var H = window.__HV__, $app = document.getElementById('app'), $hd = document.getElementById('hd');
var KEY = 'hvac_prog_v1';
var P = load();
var TEACH = /[?&]t(eacher)?=1/.test(location.search) || (function(){try{return localStorage.getItem('hvac_teacher')==='1'}catch(e){return false}})();

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
var NUM = ['①','②','③','④','⑤'];
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function rich(s){ return esc(s).replace(/★([^★]+)★/g, '<mark>$1</mark>'); }
function sec(ts){ var p = ts.split(':').map(Number); return p.reduce(function(a,b){ return a*60+b; }, 0); }
function yt(vid, ts){ return 'https://www.youtube.com/watch?v=' + vid + (ts ? '&t=' + sec(ts) + 's' : ''); }

function lecture(vid, tab){
  var L = H.lectures[vid]; if(!L){ location.hash = '#/'; return; }
  tab = tab || 'theory';
  header(ltitle(L), H.units ? (H.chapters.filter(function(c){ return c.items.some(function(it){ return it.vid === vid; }); })[0] || {}).t || '' : (L.pages ? '교재 ' + L.pages : ''), true);
  var tabs = [['theory', '개념 정리']];
  if(L.quiz && L.quiz.length) tabs.push(['quiz','확인 문제']);
  if(L.terms && L.terms.length) tabs.push(['terms','용어']);
  var rel = (H.byLec && H.byLec[vid]) || [];
  if(rel.length) tabs.push(['exam','실전 기출']);
  if(TEACH && L.teacher && L.teacher.length) tabs.push(['teacher','교사용']);
  var h = '<div class="tabs">' + tabs.map(function(t){ return '<button data-tab="' + t[0] + '" class="' + (t[0]===tab?'on':'') + '">' + t[1] + '</button>'; }).join('') + '</div><div id="pane"></div>';
  $app.innerHTML = h;
  $app.querySelector('.tabs').onclick = function(e){ var b = e.target.closest('button'); if(b){ location.replace('#/l/' + vid + '/' + b.dataset.tab); } };
  var pane = document.getElementById('pane');
  if(tab === 'theory'){ pane.innerHTML = theory(L); markRead(vid); }
  else if(tab === 'quiz') quiz(L, pane);
  else if(tab === 'terms') pane.innerHTML = '<div class="card" style="margin-top:14px">' + L.terms.map(termRow).join('') + '</div>';
  else if(tab === 'exam') lecExams(rel, pane);
  else if(tab === 'teacher') pane.innerHTML = '<h2 class="sec-t">교사용 메모<span class="tbadge">학생 화면에는 안 보임</span></h2><div class="card">' + L.teacher.map(function(t){ return '<div class="tnote">' + rich(t) + '</div>'; }).join('') + '</div>';
  if(tab !== 'quiz') pane.insertAdjacentHTML('beforeend', navrow(vid));
  window.scrollTo(0,0);
}

function theory(L){
  var ci = -1, part = null; H.chapters.forEach(function(c, i){ if(c.items.some(function(it){ return it.vid === L.vid; })){ ci = i; part = c; } });
  var nh = L.b.filter(function(b){ return b[0] === 'h'; }).length, ng = L.b.filter(function(b){ return b[0] === 'g'; }).length, nx = ((H.byLec || {})[L.vid] || []).length;
  var h = '<div class="cover"><span class="cv-part">PART ' + (ci + 1) + (part ? ' · ' + esc(part.t) : '') + '</span><span class="cv-no">' + esc(L.no || '') + '</span><h2>' + esc(L.t) + '</h2>' +
    '<div class="cv-goal"><b>학습 목표</b>' + rich(L.summary) + '</div>' +
    '<div class="cv-meta"><span>개념 ' + nh + '절</span>' + (ng ? '<span>그림 ' + ng + '장</span>' : '') + (L.quiz && L.quiz.length ? '<span>확인 문제 ' + L.quiz.length + '</span>' : '') + (nx ? '<span>실전 기출 ' + nx + '</span>' : '') + '</div>' +
          (L.videos ? (L.videos.length ? '<div class="vids">' + L.videos.map(function(v){ return '<a class="yt" href="' + yt(v[0]) + '" target="_blank" rel="noopener">▶ ' + esc(v[1]) + '</a>'; }).join('') + '</div>' : '') : (L.sup ? '' : '<br><a class="yt" href="' + yt(L.vid) + '" target="_blank" rel="noopener">▶ 강의 영상 보기</a>')) + '</div><div class="theory">';
  L.b.forEach(function(b){
    var k = b[0];
    if(k === 'h'){ var hv = b[3] || (L.unit ? '' : L.vid); h += '<h3>' + rich(b[1]) + (b[2] && hv ? '<a href="' + yt(hv, b[2]) + '" target="_blank" rel="noopener">▶ ' + b[2] + '</a>' : '') + '</h3>'; }
    else if(k === 'p') h += '<p>' + rich(b[1]) + '</p>';
    else if(k === 'l') h += '<ul>' + b[1].map(function(x){ return '<li>' + rich(x) + '</li>'; }).join('') + '</ul>';
    else if(k === 't') h += '<div class="tblw"><table><thead><tr>' + b[1].map(function(x){ return '<th>' + rich(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
         b[2].map(function(r){ return '<tr>' + r.map(function(x){ return '<td>' + rich(x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    else if(k === 'f') h += '<div class="fx"><div class="fn">' + rich(b[1]) + '</div><div class="ff">' + rich(b[2]) + '</div>' + (b[3] ? '<div class="fd">' + rich(b[3]) + '</div>' : '') + '</div>';
    else if(k === 'n') h += '<div class="nt"><b class="nh">' + rich(b[1]) + '</b>' + rich(b[2]) + '</div>';
    else if(k === 'g'){ var gs = [].concat(b[1]); h += '<figure class="ufig' + (gs.length > 1 ? ' multi' : '') + '">' + gs.map(function(x){ return '<img loading="lazy" src="uimg/' + x + '" alt="그림">'; }).join('') + '<figcaption>' + rich(b[2]) + (b[3] ? (b[4] ? '<a class="gsrc" href="' + esc(b[4]) + '" target="_blank" rel="noopener">' + esc(b[3]) + '</a>' : '<span class="gsrc">' + esc(b[3]) + '</span>') : '') + '</figcaption></figure>'; }
  });
  if(L.tip) h += '<div class="tip"><b>✔ 시험 직전 핵심 정리</b>' + rich(L.tip) + '</div>';
  return h + '</div>';
}

function quiz(L, pane){
  var i = 0, right = 0, picked = [];
  function show(){
    if(i >= L.quiz.length){ return finish(); }
    var q = L.quiz[i];
    var h = '<div class="prog"><i style="width:' + (i / L.quiz.length * 100) + '%"></i></div><div class="card pad q"><div class="qhead"><span class="qno">확인 문제 ' + (i+1) + '</span><span class="xsub">' + (i+1) + ' / ' + L.quiz.length + '</span></div>' +
      '<div class="qstem">' + rich(q.q) + '</div>' +
      q.c.map(function(c, j){ return '<button class="ch" data-j="' + j + '"><span class="k">' + NUM[j] + '</span>' + rich(c) + '</button>'; }).join('') +
      '<div id="rv"></div></div>';
    pane.innerHTML = h + navrow(L.vid);
    pane.querySelectorAll('.ch').forEach(function(btn){ btn.onclick = function(){ answer(+btn.dataset.j); }; });
  }
  function answer(j){
    var q = L.quiz[i], ok = j === q.a; if(ok) right++; picked.push(j);
    pane.querySelectorAll('.ch').forEach(function(b){ var k = +b.dataset.j; b.disabled = true;
      if(k === q.a) b.classList.add('ok'); else if(k === j) b.classList.add('no'); });
    document.getElementById('rv').innerHTML = '<div class="reveal ' + (ok?'ok':'no') + '"><span class="lab">' + (ok ? '정답입니다' : '오답 · 정답은 ' + NUM[q.a]) + '</span>' +
      '<div class="exp">' + rich(q.e) + '</div>' + (q.ts && (q.vid || !L.unit) ? '<a href="' + yt(q.vid || L.vid, q.ts) + '" target="_blank" rel="noopener">▶ 강의 ' + q.ts + ' 다시 보기</a>' : '') + '</div>' +
      '<div style="margin-top:12px"><button class="btn primary" id="nx">' + (i+1 < L.quiz.length ? '다음 문제' : '결과 보기') + '</button></div>';
    document.getElementById('nx').onclick = function(){ i++; show(); window.scrollTo(0,0); };
  }
  function finish(){
    P[L.vid] = P[L.vid] || {}; P[L.vid].q = [right, L.quiz.length]; P[L.vid].read = true; save();
    var wrong = L.quiz.map(function(q, k){ return picked[k] !== q.a ? k : -1; }).filter(function(k){ return k >= 0; });
    pane.innerHTML = '<div class="card result"><span class="muted small">맞힌 문제</span><b>' + right + ' / ' + L.quiz.length + '</b>' +
      (wrong.length ? '<p class="small muted">틀린 문제: ' + wrong.map(function(k){ return (k+1) + '번'; }).join(', ') + ' · 이론 탭에서 다시 확인해 보세요.</p>' : '<p class="small muted">모두 맞혔어요!</p>') +
      '<button class="btn primary" id="again">다시 풀기</button></div>' + navrow(L.vid);
    document.getElementById('again').onclick = function(){ i = 0; right = 0; picked = []; show(); };
  }
  show();
}

function termRow(t, from){
  return '<div class="term"><b>' + esc(t[0]) + '</b>' + (t[2] ? '<span class="en">' + esc(t[2]) + '</span>' : '') +
         '<div class="df">' + rich(t[1]) + '</div>' + (from ? '<div class="from"><a href="#/l/' + from.vid + '">' + esc(ltitle(from)) + '</a></div>' : '') + '</div>';
}

function terms(){
  header('용어사전', '모든 단원의 용어를 모았습니다', true);
  var list = [];
  Object.keys(H.lectures).forEach(function(v){ var L = H.lectures[v]; L.terms.forEach(function(t){ list.push([t, L]); }); });
  list.sort(function(a, b){ return a[0][0].localeCompare(b[0][0], 'ko'); });
  $app.innerHTML = '<input class="search" id="q" placeholder="용어 검색 (예: 엔탈피)" autocomplete="off"><div class="card" id="tl" style="margin-top:12px"></div>';
  var $q = document.getElementById('q'), $tl = document.getElementById('tl');
  function draw(){ var s = $q.value.trim().toLowerCase();
    var f = list.filter(function(x){ return !s || (x[0].join(' ').toLowerCase().indexOf(s) >= 0); });
    $tl.innerHTML = f.length ? f.map(function(x){ return termRow(x[0], x[1]); }).join('') : '<div class="term muted">찾는 용어가 없습니다.</div>'; }
  $q.oninput = draw; draw(); window.scrollTo(0,0);
}

function navrow(vid){
  var ready = allItems().filter(function(it){ return it.ready; }), k = -1;
  ready.forEach(function(it, j){ if(it.vid === vid) k = j; });
  var prev = ready[k-1], next = ready[k+1];
  return '<div class="navrow">' + (prev ? '<a class="btn" href="#/l/' + prev.vid + '">' + (H.units ? '‹ 이전 단원' : '‹ 이전 강의') + '</a>' : '') +
         '<a class="btn" href="#/">목록</a>' + (next ? '<a class="btn primary" href="#/l/' + next.vid + '">' + (H.units ? '다음 단원 ›' : '다음 강의 ›') + '</a>' : '') + '</div>';
}

function markRead(vid){ P[vid] = P[vid] || {}; if(!P[vid].read){ P[vid].read = true; save(); } }

// ---- 기출문제 ----
var XQ = window.__XQ__ = window.__XQ__ || {};
function loadExam(key, cb){
  if(XQ[key]) return cb(XQ[key]);
  var sc = document.createElement('script'); sc.src = 'x/' + key + '.js';
  sc.onload = function(){ cb(XQ[key]); };
  sc.onerror = function(){ $app.innerHTML = '<p class="muted">문제를 불러오지 못했습니다.</p>'; };
  document.body.appendChild(sc);
}
function xname(x){ return x.date.replace(/-/g, '.') + (x.round ? ' (' + x.round + ')' : ''); }
function ximg(src){ return '<img class="xfig" loading="lazy" src="ximg/' + src + '" alt="그림">'; }
function lecLink(vid){
  if(H.vid2unit && H.vid2unit[vid]) vid = H.vid2unit[vid];
  var L = H.lectures[vid]; if(!L) return '';
  return '<a class="rel" href="#/l/' + vid + '">📘 관련 단원: ' + esc(ltitle(L)) + ' ›</a>';
}
var XKIND = ['산업기사', '기능사'];
function examList(){
  header('기출문제', '공조냉동기계 산업기사 · 기능사 필기', true);
  var kind = (location.hash.match(/k=(\d)/) || [])[1] || '0';
  var h = '<div class="chips">' + XKIND.map(function(k, i){ return '<a href="#/x?k=' + i + '" class="' + (String(i) === kind ? 'on' : '') + '">' + k + '</a>'; }).join('') + '</div>';
  var list = H.exams.filter(function(x){ return x.kind === XKIND[+kind]; });
  var years = {};
  list.forEach(function(x){ (years[x.date.slice(0, 4)] = years[x.date.slice(0, 4)] || []).push(x); });
  if(!list.length) h += '<p class="muted small" style="margin-top:14px">준비 중입니다.</p>';
  Object.keys(years).sort().reverse().forEach(function(y){
    h += '<h2 class="sec-t">' + y + '년</h2><div class="ulist">';
    years[y].forEach(function(x){
      var p = P['x_' + x.key] || {};
      var meta = x.n + '문항 · ' + (x.exp >= x.n ? '해설 완료' : x.exp ? '해설 ' + x.exp + '/' + x.n : '해설 준비 중') + (p.s ? ' · 내 점수 ' + p.s[0] + '/' + p.s[1] : '');
      h += '<a class="unit' + (p.s ? ' done' : '') + '" href="#/x/' + x.key + '"><span class="unum">' + x.date.slice(5, 7) + '월</span><span class="ubody"><span class="utitle">' + esc(xname(x)) + '</span><span class="umeta">' + esc(meta) + '</span></span><span class="ar">›</span></a>';
    });
    h += H.units ? '</div></details>' : '</div>';
  });
  h += '<footer>기출문제 원문 출처: 최강 자격증 기출문제 전자문제집 CBT(comcbt.com).<br>해설은 수업용으로 새로 작성했습니다. 오래된 회차는 공학단위(kcal, kgf/cm²)를 씁니다.</footer>';
  $app.innerHTML = h; window.scrollTo(0, 0);
}
function exam(key, mode){
  var meta = (H.exams || []).filter(function(x){ return x.key === key; })[0];
  if(!meta){ location.hash = '#/x'; return; }
  header(meta.kind + ' ' + xname(meta), meta.n + '문항', true);
  $app.innerHTML = '<p class="muted small" style="margin-top:14px">불러오는 중…</p>';
  loadExam(key, function(X){
    mode = mode || 'solve';
    var h = '<div class="xhead"><b>' + esc(meta.kind + ' 필기 · ' + xname(meta)) + '</b><span>' + X.qs.length + '문항 · ' + X.subjects.length + '과목 · ' + (X.subjects.length > 1 ? '과목당 20문항, 과목별 40점·평균 60점 이상 합격' : '60점 이상 합격') + '</span></div><div class="tabs"><button data-m="solve" class="' + (mode === 'solve' ? 'on' : '') + '">문제지</button><button data-m="sheet" class="' + (mode === 'sheet' ? 'on' : '') + '">정답과 해설</button></div><div id="pane"></div>';
    $app.innerHTML = h;
    $app.querySelector('.tabs').onclick = function(e){ var b = e.target.closest('button'); if(b) location.replace('#/x/' + key + '/' + b.dataset.m); };
    var pane = document.getElementById('pane');
    if(mode === 'sheet') sheet(X, pane); else solve(X, pane);
    window.scrollTo(0, 0);
  });
}
function qBody(q){
  var h = '<div class="qstem">' + rich(q.q) + '</div>' + (q.qi || []).map(ximg).join('');
  return h;
}
function chBody(q, j){ return rich(q.c[j] || '') + (q.ci[j] || []).map(ximg).join(''); }
function sheet(X, pane){
  var subj = X.subjects;
  var h = '<div class="chips">' + subj.map(function(s, i){ return '<a href="javascript:void(0)" data-s="' + i + '">' + (i + 1) + '과목 ' + esc(s) + '</a>'; }).join('') + '</div>';
  var cur = '';
  X.qs.forEach(function(q){
    if(q.s !== cur){ cur = q.s; h += '<h2 class="sec-t" id="s' + subj.indexOf(cur) + '">' + (subj.indexOf(cur) + 1) + '과목 · ' + esc(cur) + '</h2>'; }
    h += '<div class="card pad xq"><div class="qhead"><span class="qno">' + q.n + '번</span>' + (q.k ? '<span class="xsub">' + esc(q.k) + '</span>' : '') + '</div>' + qBody(q) +
      '<div class="xopt">' + q.c.map(function(c, j){ return '<div class="ch' + (j === q.a ? ' ok' : '') + '" style="cursor:default"><span class="k">' + NUM[j] + '</span>' + chBody(q, j) + '</div>'; }).join('') + '</div>' +
      '<div class="ans"><b>정답 ' + NUM[q.a] + '</b>' + (q.e ? ' · ' + rich(q.e) : ' · <span class="muted">해설 준비 중</span>') + '</div>' + (TEACH && q.d ? '<div class="nt"><b class="nh">⚠ 정답 이견 (교사용)</b>' + rich(q.d) + '</div>' : '') + (q.lec ? lecLink(q.lec) : '') + '</div>';
  });
  pane.innerHTML = h + '<div class="navrow"><a class="btn" href="#/x">기출 목록</a></div>';
  pane.querySelectorAll('.chips a').forEach(function(a){ a.onclick = function(){ var t = document.getElementById('s' + a.dataset.s); if(t) window.scrollTo(0, t.getBoundingClientRect().top + window.scrollY - 70); }; });
}
function solve(X, pane){
  var st = P['x_' + X.key] || {}, picks = st.p || {};
  var i = 0; while(i < X.qs.length && picks[X.qs[i].n] !== undefined) i++;
  if(i >= X.qs.length) i = 0;
  function show(){
    var q = X.qs[i], done = picks[q.n] !== undefined;
    var nd = X.qs.filter(function(z){ return picks[z.n] !== undefined; }).length;
    var h = '<div class="prog"><i style="width:' + (nd / X.qs.length * 100) + '%"></i></div><div class="card pad q"><div class="qhead"><span class="qno">' + q.n + '번</span><span class="xsub">' + esc(q.s) + ' · ' + q.n + ' / ' + X.qs.length + '</span></div>' + qBody(q) +
      q.c.map(function(c, j){ return '<button class="ch" data-j="' + j + '"><span class="k">' + NUM[j] + '</span>' + chBody(q, j) + '</button>'; }).join('') + '<div id="rv"></div></div>' +
      '<div class="navrow">' + (i > 0 ? '<button class="btn" id="pv">‹ 이전</button>' : '') + '<a class="btn" href="#/x">목록</a>' + (i + 1 < X.qs.length ? '<button class="btn" id="sk">다음 ›</button>' : '<button class="btn primary" id="fin">채점</button>') + '</div>';
    pane.innerHTML = h;
    pane.querySelectorAll('.ch').forEach(function(b){ b.onclick = function(){ if(picks[q.n] === undefined){ picks[q.n] = +b.dataset.j; store(); } reveal(); }; });
    var pv = document.getElementById('pv'), sk = document.getElementById('sk'), fin = document.getElementById('fin');
    if(pv) pv.onclick = function(){ i--; show(); window.scrollTo(0, 0); };
    if(sk) sk.onclick = function(){ i++; show(); window.scrollTo(0, 0); };
    if(fin) fin.onclick = finish;
    if(done) reveal();
    function reveal(){
      var j = picks[q.n], ok = j === q.a;
      pane.querySelectorAll('.ch').forEach(function(b){ var k = +b.dataset.j; b.disabled = true; if(k === q.a) b.classList.add('ok'); else if(k === j) b.classList.add('no'); });
      document.getElementById('rv').innerHTML = '<div class="reveal ' + (ok ? 'ok' : 'no') + '"><span class="lab">' + (ok ? '정답입니다' : '오답 · 정답은 ' + NUM[q.a]) + '</span><div class="exp">' + (q.e ? rich(q.e) : '해설 준비 중') + '</div>' + (q.lec ? lecLink(q.lec) : '') + '</div>';
    }
  }
  function store(){ st.p = picks; P['x_' + X.key] = st; save(); }
  function finish(){
    var ans = X.qs.filter(function(q){ return picks[q.n] !== undefined; }), right = ans.filter(function(q){ return picks[q.n] === q.a; }).length;
    st.s = [right, X.qs.length]; store();
    var bySub = {};
    X.qs.forEach(function(q){ var b = bySub[q.s] = bySub[q.s] || [0, 0]; b[1]++; if(picks[q.n] === q.a) b[0]++; });
    var wrong = X.qs.filter(function(q){ return picks[q.n] !== undefined && picks[q.n] !== q.a; });
    pane.innerHTML = '<div class="card result"><span class="muted small">맞힌 문제</span><b>' + right + ' / ' + X.qs.length + '</b>' +
      '<p class="small muted">' + Object.keys(bySub).map(function(s){ return esc(s) + ' ' + bySub[s][0] + '/' + bySub[s][1] + (bySub[s][0] / bySub[s][1] < 0.4 ? ' (과락 주의)' : ''); }).join(' · ') + '</p>' +
      (wrong.length ? '<p class="small muted">틀린 문제: ' + wrong.map(function(q){ return q.n + '번'; }).join(', ') + '</p>' : '') +
      '<button class="btn primary" id="again">처음부터 다시</button> <a class="btn" href="#/x/' + X.key + '/sheet">해설지 보기</a></div>';
    document.getElementById('again').onclick = function(){ picks = {}; st = {}; store(); i = 0; show(); };
  }
  show();
}
function lecExams(rel, pane){
  pane.innerHTML = '<p class="muted small" style="margin-top:14px">이 강의와 관련된 기출문제 ' + rel.length + '개 · 불러오는 중…</p>';
  var keys = []; rel.forEach(function(r){ if(keys.indexOf(r[0]) < 0) keys.push(r[0]); });
  var left = keys.length;
  keys.forEach(function(k){ loadExam(k, function(){ if(--left === 0) draw(); }); });
  function draw(){
    var h = '<p class="muted small" style="margin-top:14px">이 강의와 관련된 기출문제 ' + rel.length + '개 (최근 회차부터)</p>';
    rel.slice().sort(function(a, b){ return b[0] < a[0] ? -1 : 1; }).forEach(function(r){
      var X = XQ[r[0]], q = X.qs.filter(function(q){ return q.n === r[1]; })[0];
      h += '<div class="card pad xq"><div class="qhead"><span class="qno">' + esc(X.kind + ' ' + X.date.replace(/-/g, '.')) + ' · ' + q.n + '번</span></div>' + qBody(q) +
        '<div class="xopt">' + q.c.map(function(c, j){ return '<div class="ch' + (j === q.a ? ' ok' : '') + '" style="cursor:default"><span class="k">' + NUM[j] + '</span>' + chBody(q, j) + '</div>'; }).join('') + '</div>' +
        '<div class="ans"><b>정답 ' + NUM[q.a] + '</b>' + (q.e ? ' · ' + rich(q.e) : '') + '</div></div>';
    });
    pane.innerHTML = h;
  }
}

function route(){
  var m = location.hash.match(/^#\/l\/([\w-]+)(?:\/(\w+))?/);
  var x = location.hash.match(/^#\/x(?:\/(\w+))?(?:\/(\w+))?/);
  if(m && !H.lectures[m[1]] && H.vid2unit && H.vid2unit[m[1]]){ location.replace('#/l/' + H.vid2unit[m[1]]); return; }
  if(m) lecture(m[1], m[2]); else if(x && x[1]) exam(x[1], x[2]); else if(x) examList(); else if(location.hash === '#/terms') terms(); else if(location.hash === '#/guide') guide(); else if(location.hash === '#/me') me(); else if(location.hash === '#/u') units(); else if(/^#\/p\/\d+$/.test(location.hash)) part(+location.hash.slice(4)); else hub();
}
if(/[?&]t(eacher)?=1/.test(location.search)){ try{ localStorage.setItem('hvac_teacher','1'); }catch(e){} }
window.addEventListener('hashchange', function(){ route(); window.scrollTo(0, 0); }); route();
})();
</script>
</body>
